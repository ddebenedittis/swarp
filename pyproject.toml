[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wmas"
version = "0.1.0"
description = "Warp Multi-Agent Simulator: a GPU-resident, differentiable, vectorized 2D multi-agent simulator built on NVIDIA Warp with zero-copy PyTorch interop."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Davide" }]
keywords = ["multi-agent", "simulator", "differentiable", "warp", "gpu", "robotics"]
dependencies = [
    "warp-lang>=1.15",
    "torch>=2.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Interactive/headless visualization. Install with `pip install wmas[viz]` or
# `uv pip install -e '.[viz]'`. Kept out of the core so the simulator stays lean.
viz = [
    "pygame-ce>=2.5",
    "imageio[ffmpeg]>=2.34",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
# VMAS comparison benchmark (wmas/benchmark/compare_vmas.py). VMAS pulls in gym,
# which requires numpy < 2. Falls back to a vendored ./VectorizedMultiAgentSimulator
# checkout if `vmas` is not importable.
bench = [
    "vmas>=1.5",
]
# TorchRL EnvBase wrapper (wmas/interop/torchrl.py). Optional: the core install
# stays lean and only depends on warp + torch + numpy.
torchrl = [
    "torchrl>=0.5",
    "tensordict>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["wmas"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["VectorizedMultiAgentSimulator"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "SIM108", # ternary not always clearer inside kernels
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
