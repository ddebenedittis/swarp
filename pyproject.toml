[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarp"
version = "0.1.0"
description = "Swarm simulation on NVIDIA Warp: a GPU-resident, differentiable, vectorized 2D multi-agent simulator built on NVIDIA Warp with zero-copy PyTorch interop."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Davide De Benedittis", email = "davide@cyber-fusion.io" }]
keywords = ["multi-agent", "simulator", "differentiable", "warp", "gpu", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "warp-lang>=1.15",
    "torch>=2.4",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://ddebenedittis.github.io/swarp"
Documentation = "https://ddebenedittis.github.io/swarp"
Repository = "https://github.com/ddebenedittis/swarp"
Issues = "https://github.com/ddebenedittis/swarp/issues"

[project.optional-dependencies]
# Interactive/headless visualization. Install with `pip install swarp[viz]` or
# `uv pip install -e '.[viz]'`. Kept out of the core so the simulator stays lean.
viz = [
    "pygame-ce>=2.5",
    "imageio[ffmpeg]>=2.34",
    "pillow>=10",
]
# TorchRL EnvBase wrapper (swarp/interop/torchrl.py) and the MAPPO training
# examples (examples/pusht_torchrl.py). Optional: the core install stays lean
# and only depends on warp + torch + numpy. torchrl pulls in tensordict itself,
# but it's pinned explicitly here so `pip install -e '.[torchrl]'` resolves a
# version compatible with the rest of the stack in one shot.
torchrl = [
    "torchrl>=0.5",
    "tensordict>=0.5",
]
# VMAS comparison benchmark (swarp/benchmark/compare_vmas.py). VMAS pulls in gym,
# which requires numpy < 2. Falls back to an optional (gitignored) local
# ./VectorizedMultiAgentSimulator clone if `vmas` is not importable.
bench = [
    "vmas>=1.5",
]
# Cross-simulator throughput benchmark (swarp/benchmark/compare_sims.py). JaxMARL
# and CAMAR are JAX-based and want recent numpy, so they CANNOT share the `bench`
# venv (vmas pins numpy < 2). Each is installed into its own Python 3.12 venv and
# the orchestrator drives one subprocess per simulator with that venv's
# interpreter (see `--python SIM=PATH`). Kept as two extras because jaxmarl and
# camar may pin conflicting jax versions; collapse into one venv if they resolve.
bench-jaxmarl = [
    "jaxmarl",
]
bench-camar = [
    "camar[cuda12]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
# Sphinx documentation site (docs/, published to GitHub Pages by .github/workflows/docs.yml).
# Deliberately free of swarp itself: the site carries no autodoc, so the docs runner never
# has to install torch/warp. `uv sync --only-group docs` is all the build needs.
docs = [
    "sphinx>=8.1",
    "sphinx-rtd-theme>=3.0",
    "myst-parser>=4.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["swarp"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["VectorizedMultiAgentSimulator"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "SIM108", # ternary not always clearer inside kernels
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: requires a CUDA device (deselect on CPU-only machines with -m 'not gpu')",
    "viz: needs the `viz` extra (pygame-ce / imageio) for rendering or video export",
]
