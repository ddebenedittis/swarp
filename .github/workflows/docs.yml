name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# One Pages site per repository, so both halves ship in one artifact: the paper's project
# page (site/, Astro) at the root and the Sphinx docs (docs/) under docs/.
env:
  SITE_ORIGIN: https://ddebenedittis.github.io
  SITE_BASE: /swarp/

jobs:
  # Build on every push and PR, so a broken cross-reference fails before it ships.
  # The docs carry no autodoc, so this needs neither torch nor warp -- only the
  # `docs` dependency group, which installs in seconds.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install the docs toolchain
        run: uv sync --only-group docs

      # -W turns warnings into errors: a dead link or an orphaned page fails here.
      - name: Build the docs
        run: uv run --no-sync sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the project page
        working-directory: site
        run: |
          npm ci
          npx --no-install astro build --site "$SITE_ORIGIN" --base "$SITE_BASE"

      # The docs used to live at the root. Each old top-level page gets a stub that forwards
      # to its new address, keeping the #fragment, so links already out there still land.
      - name: Assemble the site
        run: |
          cp -r docs/_build/html site/dist/docs
          for page in docs/_build/html/*.html; do
            name=$(basename "$page")
            [ "$name" = index.html ] && continue
            cat > "site/dist/$name" <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>Moved to docs/$name</title>
          <link rel="canonical" href="docs/$name">
          <meta http-equiv="refresh" content="0; url=docs/$name">
          <script>location.replace("docs/$name" + location.hash)</script>
          EOF
          done

      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  # Deploy only from main. Requires Settings -> Pages -> Source: "GitHub Actions".
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
